[build-system]
requires = [
    "scikit-build-core>=0.10",
    "cython>=3.0",
    "cython-cmake>=0.2",
    "setuptools-scm>=3.4.1",
]
build-backend = "scikit_build_core.build"

[project]
name = "pupil_detectors"
description = "Pupil Labs 2D Pupil Detector"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
# COPYING/COPYING.LESSER = pupil_detectors' own license; THIRD_PARTY_LICENSES =
# attribution for the statically-linked OpenCV (Apache-2.0) + zlib. All land in
# the wheel's *.dist-info/licenses/.
license-files = ["COPYING", "COPYING.LESSER", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "Pupil Labs GmbH", email = "info@pupil-labs.com" }]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "numpy",
    "cysignals; platform_system != 'Windows'",
]

[project.urls]
Homepage = "https://github.com/pupil-labs/pupil-detectors"
Changelog = "https://github.com/pupil-labs/pupil-detectors/blob/master/CHANGES.rst"

[project.optional-dependencies]
docs = [
    "jaraco.packaging>=9",
    "rst.linker>=1.9",
    "sphinx",
]
testing = [
    "pytest>=6",
    "pytest-checkdocs>=2.4",
    "pytest-cov",
    "pytest-enabler>=1.3",
    "pytest-mypy>=0.9.1; python_implementation != 'PyPy'",
]

[tool.scikit-build]
# CMakeLists lives at the package root (classic skbuild's cmake_source_dir).
cmake.source-dir = "src/pupil_detectors"
cmake.version = ">=3.21"
build-dir = "build/{wheel_tag}"
# Pure-Python package copied from src/; compiled modules placed by CMake
# install(). Keep C/C++/Cython sources out of the wheel.
wheel.packages = ["src/pupil_detectors"]
wheel.exclude = [
    "**/*.pyx",
    "**/*.pxd",
    "**/*.hpp",
    "**/*.h",
    "**/*.cpp",
    "**/CMakeLists.txt",
]
sdist.include = [
    "src/pupil_detectors/**/*.pyx",
    "src/pupil_detectors/**/*.pxd",
    "src/pupil_detectors/**/*.h",
    "src/pupil_detectors/**/*.hpp",
    "src/pupil_detectors/**/*.cpp",
    "src/pupil_detectors/**/CMakeLists.txt",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

# Python 3.11+ gets a single stable-ABI (abi3) wheel; 3.10 gets a normal
# version-specific wheel (Limited-API memoryviews require 3.11+). py-api drives
# SKBUILD_SABI_VERSION in CMake (-> Py_LIMITED_API / .abi3 suffix).
[[tool.scikit-build.overrides]]
if.python-version = ">=3.11"
wheel.py-api = "cp311"

# Windows links a STATIC OpenCV (built by scripts/build-opencv-windows.sh). Its
# OpenCVConfig.cmake is a "Windows pack" dispatcher that only searches the
# staticlib/ subdir when OpenCV_STATIC is ON, so force it here.
[[tool.scikit-build.overrides]]
if.platform-system = "win32"
cmake.define.OpenCV_STATIC = "ON"

[tool.setuptools_scm]

[tool.cibuildwheel]
archs = ["native"]
# Cap cmake build parallelism (extension + OpenCV before-all) so memory-heavy
# compiles don't OOM the runner. Bump for beefier/self-hosted runners.
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2" }
# Python floor (>=3.10) comes from requires-python; cibuildwheel honors it.
# Skip: musllinux (before-all uses yum, not apk) and free-threaded CPython
# (cp3??t-*, which can't use the stable ABI and lacks test-dep wheels).
skip = "*-musllinux* cp3??t-*"

build-frontend = "build"

test-command = "pytest {package}/tests -v"
before-test = ""
test-requires = ["pytest"]
test-extras = []

manylinux-x86_64-image = "manylinux2014"

[tool.cibuildwheel.macos]
before-all = ["brew install eigen opencv"]
# Homebrew's prefix isn't on CMake's default search path, so find_package can't
# see the brewed Eigen/OpenCV. Cover Apple-silicon (/opt/homebrew) and Intel
# (/usr/local) runners.
environment = { CMAKE_PREFIX_PATH = "/opt/homebrew:/usr/local", CMAKE_BUILD_PARALLEL_LEVEL = "2" }

[tool.cibuildwheel.linux]
before-all = ["yum install -y eigen3-devel", "bash scripts/manylinux-before-all.sh"]
# OpenCV is statically linked into the extension, so there is nothing to bundle;
# auditwheel just applies the manylinux tag and strips the extension's symbols.
repair-wheel-command = "auditwheel repair --strip -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
# choco for Eigen, but build a minimal core+imgproc *static* OpenCV from source
# (choco's opencv is the ~68MB monolithic shared opencv_world). It is linked
# straight into detector_2d.pyd, so the wheel is self-contained: no bundled DLLs
# and thus no delvewheel/repair step. Flattened install -> OpenCVConfig.cmake at
# C:/opencv-min/cmake.
before-all = ["choco install eigen", "bash scripts/build-opencv-windows.sh"]
# Point at the OpenCV install ROOT; its OpenCVConfig.cmake auto-detects the
# arch/runtime (x64/vcNN) subdir, so this is toolset-agnostic (no hardcoded vc17).
# That dispatcher only searches the staticlib/ leaf when OpenCV_STATIC is ON,
# which we set via the win32 scikit-build override below.
environment = { OpenCV_DIR="C:/opencv-min", CMAKE_BUILD_PARALLEL_LEVEL = "2" }
